name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install CMake on macOS
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Install CMake on Windows
        if: runner.os == 'Windows'
        run: choco install cmake --yes
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace
      - name: Build Tauri bundles
        run: npm run tauri:build
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-checksums
          find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) -print0 |
            while IFS= read -r -d '' file; do
              if command -v shasum >/dev/null 2>&1; then
                shasum -a 256 "$file"
              else
                sha256sum "$file"
              fi
            done > "release-checksums/checksums-${{ runner.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: voxta-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            release-checksums/*.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Voxta ${{ github.ref_name }} Early Preview
          body: |
            Voxta ${{ github.ref_name }} is an Early Preview release.

            Installers are not production-proven until cross-platform manual QA has completed.
            Verify downloaded artifacts with the included SHA-256 checksum files.
          files: artifacts/**/*
          draft: true
          prerelease: true
